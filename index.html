<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h2>Smart Home Control</h2>
        <div class="button-group">
            <button onclick="toggleLight('v1', this)" class="light-btn">Living Room Light</button>
            <button onclick="toggleLight('v2', this)" class="light-btn">Bedroom Light</button>
            <button onclick="toggleLight('v3', this)" class="light-btn">Kitchen Light</button>
            <button onclick="toggleLight('v4', this)" class="light-btn">Outdoor Light</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
